<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掌柜</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand"><span class="mark"></span>掌柜</div>
    <nav id="agents"></nav>
    <button id="new-chat" class="ghost" type="button">＋ 新对话</button>
    <div class="rail-label">历史</div>
    <div id="sessions"></div>
    <button id="open-schedules" class="ghost" type="button">定时任务</button>
    <button id="open-settings" class="ghost" type="button">设置</button>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="toggle-rail" class="icon" type="button" aria-label="菜单">☰</button>
      <div class="title"><strong id="agent-name"></strong><span id="agent-model"></span></div>
      <button id="toggle-side" class="ghost small" type="button" hidden></button>
    </header>
    <div id="setup-banner" hidden></div>
    <div id="scroll"><div id="messages"></div></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="输入任务，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" type="submit">发送</button>
      <button id="stop" type="button" hidden>停止</button>
    </form>
  </main>

  <aside id="side" hidden>
    <header><strong id="side-title"></strong><span id="side-actions"></span><button id="close-side" class="icon" type="button" aria-label="关闭">✕</button></header>
    <div id="side-body"></div>
  </aside>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <header><h2>设置</h2><button class="icon" value="cancel" aria-label="关闭">✕</button></header>
    <div id="settings-body"></div>
    <footer><span id="settings-status"></span><button type="button" id="save-settings">保存</button></footer>
  </form>
</dialog>
<dialog id="schedules">
  <form method="dialog" class="dialog-form">
    <header><h2>定时任务</h2><button class="icon" value="cancel" aria-label="关闭">✕</button></header>
    <div class="dialog-body">
      <p>到点后 agent 自己运行，结果出现在左侧历史里。程序开着才会运行；错过的当天会补跑一次。无人值守时不会改文件、不会运行命令，邮件也只是起草。</p>
      <div id="schedule-list"></div>
      <h3>新建</h3>
      <label class="field">名称<input id="sched-name" placeholder="例如：每日线索"><span></span></label>
      <label class="field">谁来做<select id="sched-agent"></select><span></span></label>
      <label class="field">时间<span class="pair"><select id="sched-days"><option value="daily">每天</option><option value="weekdays">工作日</option></select><input id="sched-time" type="time" value="09:00"></span><span></span></label>
      <label class="field top">任务<textarea id="sched-prompt" rows="3" placeholder="要它做什么，写得和平时发消息一样完整"></textarea><span></span></label>
    </div>
    <footer><span id="sched-status"></span><button type="button" id="add-schedule">添加</button></footer>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
