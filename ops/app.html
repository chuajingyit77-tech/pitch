<title>工厂营运台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Jost:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: a beauty counter. A wordmark header closed by a gold foil hairline,
   capsule tabs, a pastel counter-top on Today, and every product drawn as its
   own pack on a shelf, tinted by range: mint for home care, rose for skin care,
   herb for pest control. Typing still happens in a sheet above the page. */
:root {
  --bg: #fbf1f3; --surface: #ffffff; --sunk: #f6e6eb;
  --ink: #2e1426; --muted: #7d6272; --line: #eed8df;
  --accent: #8e2f6b; --accent-ink: #ffffff; --accent-soft: #f6dcea; --gold: #b8893a;
  --mint: #d3efe8; --mint-ink: #1c6b60; --rose: #fbd5dd; --rose-ink: #a8395c;
  --herb: #e4eec6; --herb-ink: #566b1c; --peach: #fde9d8;
  --good: #1f7a4d; --good-soft: #dff2e7;
  --warn: #96600a; --warn-soft: #fbeed2;
  --bad: #c9401a; --bad-soft: #fde5dc;
  --veil: rgba(46,20,38,.42);
  --shadow: 0 1px 2px rgba(46,20,38,.05), 0 10px 28px rgba(142,47,107,.10);
  --f-body: Jost, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-head: "Bodoni Moda", "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b0f17; --surface: #27161f; --sunk: #321e29;
  --ink: #f7e9ef; --muted: #b999aa; --line: #47303c;
  --accent: #e991c4; --accent-ink: #2b0d1f; --accent-soft: #4b2240; --gold: #d8b46c;
  --mint: #173f39; --mint-ink: #8fdccb; --rose: #4f2332; --rose-ink: #f5a9bd;
  --herb: #303b15; --herb-ink: #c8de88; --peach: #49301f;
  --good: #6fd09a; --good-soft: #16321f;
  --warn: #e8b257; --warn-soft: #35280e;
  --bad: #ff9a7a; --bad-soft: #40201a;
  --veil: rgba(8,3,6,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.4);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b0f17; --surface: #27161f; --sunk: #321e29;
  --ink: #f7e9ef; --muted: #b999aa; --line: #47303c;
  --accent: #e991c4; --accent-ink: #2b0d1f; --accent-soft: #4b2240; --gold: #d8b46c;
  --mint: #173f39; --mint-ink: #8fdccb; --rose: #4f2332; --rose-ink: #f5a9bd;
  --herb: #303b15; --herb-ink: #c8de88; --peach: #49301f;
  --good: #6fd09a; --good-soft: #16321f;
  --warn: #e8b257; --warn-soft: #35280e;
  --bad: #ff9a7a; --bad-soft: #40201a;
  --veil: rgba(8,3,6,.6);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.4);
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance }
.num { font-variant-numeric: tabular-nums }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface) }
.top::after { content: ""; position: absolute; inset: auto 0 0; height: 1px; background: linear-gradient(90deg, var(--line), var(--gold) 50%, var(--line)) }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 12px 8px }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 }
.brand .mark { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center }
.brand .mark svg { width: 16px; height: 20px }
.brand .mark path { fill: var(--accent) }
.brand b { display: block; font: 700 19px/1.15 var(--f-head); letter-spacing: .01em; overflow-wrap: anywhere }
.brand small { display: block; font: 400 11.5px/1.3 var(--f-body); color: var(--muted); letter-spacing: .04em }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px }
.nav::-webkit-scrollbar { display: none }
.tab { flex: none; border: 0; background: none; padding: 6px 14px; border-radius: 99px; color: var(--muted); cursor: pointer; font-weight: 500; white-space: nowrap }
.tab:hover { color: var(--ink) }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: var(--bad); color: var(--surface); font: 600 11px/18px var(--f-body); text-align: center }

main { padding-block: 18px 80px; display: flex; flex-direction: column; gap: 20px }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.head h1 { font-size: 30px; font-weight: 600; line-height: 1.15 }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 60ch }
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 20px; background: linear-gradient(120deg, var(--rose) 0%, var(--peach) 50%, var(--mint) 100%) }
.hero .head { position: relative; z-index: 1 }
.hero .head h1 { font-size: 36px }
.hero .head p { color: var(--ink); opacity: .78 }
.hero-art { position: absolute; right: 18px; bottom: -10px; display: none; gap: 6px; align-items: flex-end; opacity: .9 }
.hero-art .ph { background: none; width: auto; height: auto }

@media (min-width: 760px) { .hero { padding: 30px 28px } .hero-art { display: flex } .hero .head { max-width: 62% } }
.note { padding: 10px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--ink); font-size: 14px }
.note.info { background: var(--accent-soft) }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink) }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.danger { color: var(--bad) }
.btn.small { padding: 5px 12px; font-size: 13.5px }
.btn[disabled] { opacity: .45; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 14px; cursor: pointer; font-size: 14px; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* figures */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { background: var(--surface); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow) }
.stat b { display: block; font: 600 26px/1.15 var(--f-head); font-variant-numeric: tabular-nums lining-nums }
.stat span { color: var(--muted); font-size: 13px }

/* packs: each product as a small drawing, tinted by range */
.ph { --c: var(--mint); --ci: var(--mint-ink); flex: none; width: 46px; height: 54px; border-radius: 14px; background: var(--c); display: grid; place-items: center }
.ph.skin { --c: var(--rose); --ci: var(--rose-ink) }
.ph.pest { --c: var(--herb); --ci: var(--herb-ink) }
.ph svg { height: 38px; width: auto; display: block }
.bt .b { fill: var(--ci) } .bt .c { fill: var(--gold) } .bt .l { fill: var(--surface); opacity: .82 }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; padding: 0; display: flex; flex-direction: column; text-align: left; cursor: pointer; min-width: 0 }
.card:hover { border-color: var(--accent) }
.card .ph { width: 100%; height: 116px; border-radius: 0 }
.card .ph svg { height: 86px }
.card.off .ph { opacity: .45 }
.card .cb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.card .t { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere }
.card .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.card .flags { display: flex; gap: 4px; flex-wrap: wrap }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin }
.sku { flex: none; width: 92px; border: 0; background: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center }
.sku .ph { width: 76px; height: 86px; border-radius: 20px }
.sku .ph svg { height: 58px }
.sku .n { font-size: 12.5px; line-height: 1.25; overflow-wrap: anywhere }

/* lists */
.list { display: flex; flex-direction: column; gap: 8px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100% }
button.item { cursor: pointer }
button.item:hover { border-color: var(--accent) }
.item .body { flex: 1; min-width: 0 }
.item .t { font-weight: 600; overflow-wrap: anywhere }
.item .s { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere }
.item .r { text-align: right; flex: none; font-variant-numeric: tabular-nums }
.pill { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.acc { background: var(--accent-soft); color: var(--accent) }
.group h2 { font: 600 12.5px/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px }
.group h2 .count { letter-spacing: 0; background: var(--sunk); border-radius: 99px; padding: 2px 8px; font-size: 11.5px }
.todo::before { content: ""; flex: none; width: 10px; height: 10px; margin: 7px 2px 0; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 4px var(--sunk) }
.todo.bad::before { background: var(--bad); box-shadow: 0 0 0 4px var(--bad-soft) }
.todo.warn::before { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft) }
.todo.good::before { background: var(--good); box-shadow: 0 0 0 4px var(--good-soft) }
.empty { border-radius: 22px; background: var(--sunk); padding: 26px 18px; text-align: center; color: var(--muted) }
.empty b { display: block; color: var(--ink); font: 600 18px/1.3 var(--f-head); margin-bottom: 4px }
.quote { background: var(--sunk); border-radius: 16px; padding: 11px 14px; white-space: pre-wrap; overflow-wrap: anywhere }
.zh { color: var(--muted); font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 20; background: var(--veil); display: flex; align-items: flex-end; justify-content: center }
.panel { background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 28px 28px 0 0; box-shadow: var(--shadow);
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
@media (min-width: 700px) { #sheet { align-items: center } .panel { border-radius: 28px; max-height: 88% } }
.panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.panel-top h2 { font-size: 23px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; min-width: 0 }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.f > span { font-size: 13px; color: var(--muted); font-weight: 500 }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 9px 12px; width: 100%; min-width: 0 }
.f input:focus, .f select:focus, .f textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
.f textarea { min-height: 96px; resize: vertical }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 66px 86px 38px; gap: 6px; align-items: end }
.line .btn { padding: 8px 0; justify-content: center }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14.5px; margin: 0 }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 18px; border-radius: 99px; max-width: min(92%, 520px); box-shadow: var(--shadow); font-size: 14.5px }
@media (prefers-reduced-motion: no-preference) { .panel { animation: up .2s ease-out } @keyframes up { from { transform: translateY(14px); opacity: .6 } to { transform: none; opacity: 1 } } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand" id="brand"></div>
      <button class="btn small" id="langBtn" data-act="lang" type="button">EN</button>
      <button class="btn small" id="setBtn" data-act="open-settings" type="button" hidden>设置</button>
    </div>
    <nav class="nav" id="nav" aria-label="sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<style>[hidden]{display:none!important}</style>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- basics
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage may be blocked */ } },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
const TAB_ID = newId();

const VIEWS = ['today', 'orders', 'inbox', 'products', 'production', 'customers', 'faq', 'marketing', 'approvals', 'team'];

const S = {
  lang: LS.get('ops-lang', 'zh'),
  view: 'today',
  mode: 'loading',          // loading | db | local
  ready: false, stale: false,
  isOwner: false, canWrite: true, uid: null, hasAI: false,
  products: [], stock: {}, costs: {}, batches: [], orders: [], faq: [], inbox: [], approvals: [],
  decisions: {}, custs: {},
  settings: { company: '', cur: 'Rs', cc: '92', codDays: 7, shipDays: 2 },
  filter: { orders: 'open', inbox: 'open', approvals: 'pending' },
  sheet: null,
};
let sample = null;

const L = (zh, en) => (S.lang === 'zh' ? zh : en);
const money = n => `${S.settings.cur || 'Rs'} ${Math.round(Number(n) || 0).toLocaleString('en-US')}`;
const pad = n => String(n).padStart(2, '0');
const fmtDate = ts => { if (!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtTime = ts => { if (!ts) return ''; const d = new Date(ts); return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayStart = (ts = Date.now()) => new Date(ts).setHours(0, 0, 0, 0);
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 6e4));
  if (m < 60) return L(`${m} 分钟`, `${m} min`);
  const h = Math.round(m / 60);
  if (h < 48) return L(`${h} 小时`, `${h} h`);
  return L(`${Math.round(h / 24)} 天`, `${Math.round(h / 24)} d`);
}
const digits = s => String(s || '').replace(/\D+/g, '');
// A local number (03xx...) becomes an international one for a wa.me link.
function waNumber(phone) {
  let d = digits(phone);
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = (S.settings.cc || '92') + d.slice(1);
  return d;
}

// ---------------------------------------------------------------- the store
// Two backends behind one small surface: the artifact's shared database, or
// this browser's own storage when the page is opened where no database answers.
const Store = (() => {
  let db = null, local = null;
  const watchers = [];
  const split = p => { const i = p.lastIndexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const fire = coll => { for (const w of watchers) if (w.coll === coll) w.run(); };
  return {
    mode: 'loading',
    start(d) { if (d) { db = d; this.mode = 'db'; } else { local = LS.get('ops-local', {}); this.mode = 'local'; } },
    watch(coll, opts, cb, onErr) {
      if (db) {
        let q = db.collection(coll);
        if (opts.orderBy) q = q.orderBy(opts.orderBy, opts.dir || 'asc');
        if (opts.limit) q = q.limit(opts.limit);
        return q.onSnapshot(
          snap => cb(snap.docs.map(d => ({ ...d.data(), id: d.id })), !snap.metadata.fromCache),
          e => onErr && onErr(e));
      }
      const w = {
        coll,
        run() {
          let rows = Object.entries(local[coll] || {}).map(([id, v]) => ({ ...clone(v), id }));
          if (opts.orderBy) {
            const k = opts.orderBy, s = opts.dir === 'desc' ? -1 : 1;
            rows.sort((a, b) => ((a[k] ?? 0) < (b[k] ?? 0) ? -s : (a[k] ?? 0) > (b[k] ?? 0) ? s : 0));
          }
          if (opts.limit) rows = rows.slice(0, opts.limit);
          cb(rows, true);
        },
      };
      watchers.push(w);
      setTimeout(() => w.run(), 0);
      return () => {};
    },
    async get(path) {
      if (db) { const s = await db.doc(path).get(); return s.exists ? { ...s.data() } : null; }
      const [c, id] = split(path); return local[c]?.[id] ? clone(local[c][id]) : null;
    },
    async set(path, data) {
      if (db) return db.doc(path).set(clone(data));
      const [c, id] = split(path); (local[c] ||= {})[id] = clone(data); LS.set('ops-local', local); fire(c);
    },
    async update(path, data) {
      if (db) return db.doc(path).update(clone(data));
      const [c, id] = split(path);
      if (!local[c]?.[id]) throw { code: 'invalid_argument' };
      Object.assign(local[c][id], clone(data)); LS.set('ops-local', local); fire(c);
    },
    // A short cooperative lease, so two people shipping at once cannot both
    // read the same stock figure and each write back their own subtraction.
    async acquire(path) {
      if (!db) return true;
      const r = await db.doc(path).acquire({ holder: TAB_ID, ttlMs: 4000 });
      return !!r.acquired;
    },
  };
})();

function errText(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return L('存不进去：你可能没有这一项的修改权限。', 'Could not save: you may not have permission to change this.');
  if (c === 'quota_exceeded') return L('数据库满了，请联系负责人清理旧记录。', 'The database is full. Ask the owner to archive old records.');
  if (c === 'resource_exhausted') return L('操作太频繁，过几秒再试。', 'Too many requests. Try again in a few seconds.');
  if (c === 'revoked' || c === 'not_granted') return L('这个页面的数据权限被收回了，请重新打开。', 'Data access was withdrawn. Reopen the page.');
  if (c === 'busy') return L('别人正在改同一笔资料，过几秒再试。', 'Someone else is changing the same record. Try again in a few seconds.');
  return L('暂时连不上，请再试一次。', 'Could not reach the data. Please try again.');
}
async function save(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === 'unavailable') { try { await sleep(600 + Math.random() * 600); await fn(); if (okMsg) toast(okMsg); return true; } catch (e2) { toast(errText(e2)); return false; } }
    toast(errText(e)); return false;
  }
}

// Stock lives in its own document per product and only ever changes here.
async function changeStock(pid, delta, absolute) {
  const path = 'stock/' + pid;
  for (let i = 0; i < 6; i++) {
    if (await Store.acquire(path)) {
      const cur = await Store.get(path);
      const qty = absolute != null ? absolute : (Number(cur?.qty) || 0) + delta;
      await Store.set(path, { qty, ts: Date.now() });
      return qty;
    }
    await sleep(500 + Math.random() * 500);
  }
  throw { code: 'busy' };
}

// ---------------------------------------------------------------- house rules
const CATS = { home: ['家居清洁', 'Home care'], skin: ['护肤', 'Skin care'], pest: ['驱虫', 'Pest control'] };

function autoFlags(name, cat) {
  const out = [];
  if (BRAND_RE.test(name || '')) out.push('tm');
  if (/\bmatrin\b|\bmortin\b|\bharpik\b/i.test(name || '')) out.push('tmlike');
  if (cat === 'skin') out.push('skin');
  if (cat === 'skin' && /acne|pimple|祛痘|痘/i.test(name || '')) out.push('drug');
  if (cat === 'pest') out.push('pest');
  return out;
}

// Match a customer message against approved answers without a model.
const STOP = new Set(['the', 'and', 'for', 'you', 'your', 'are', 'have', 'has', 'with', 'this', 'that', 'what', 'how', 'can', 'please', 'kya', 'hai', 'hain', 'aap', 'mujhe', 'ka', 'ki', 'ke', 'ko', 'se']);
const tokens = s => (String(s || '').toLowerCase().match(/[a-z0-9]{2,}|[؀-ۿ]{2,}|[一-鿿]/g) || []).filter(t => !STOP.has(t));
function matchFaq(text) {
  const msg = new Set(tokens(text));
  let best = null;
  for (const f of S.faq) {
    if (f.on === false) continue;
    const kw = tokens(f.kw), q = tokens(f.q);
    const kwHit = kw.filter(t => msg.has(t)).length;
    const qHit = q.filter(t => msg.has(t)).length;
    const score = kwHit * 2 + qHit;
    const strong = kwHit >= 2 || (kwHit >= 1 && qHit >= 2) || (q.length >= 2 && qHit / q.length >= 0.7);
    if (strong && (!best || score > best.score)) best = { f, score };
  }
  return best ? best.f : null;
}

// ---------------------------------------------------------------- derived
const prod = id => S.products.find(p => p.id === id);
const pname = p => (p ? p.name + (p.size ? ` · ${p.size}` : '') : L('（已删除的产品）', '(removed product)'));
const stockOf = id => Number(S.stock[id]?.qty) || 0;
function reserved() {
  const m = {};
  for (const o of S.orders) if (o.status === 'new') for (const it of o.items || []) m[it.pid] = (m[it.pid] || 0) + (Number(it.qty) || 0);
  return m;
}
const priceFor = (p, tier) => Number(tier === 'd' ? p.pd : tier === 'b' ? p.pb : p.pr) || 0;
const decided = id => S.decisions[id]?.status || 'pending';
const orderTotal = o => (o.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
const isOwed = o => (o.status === 'shipped' || o.status === 'done') && !o.paid;
const readyToShip = o => o.status === 'new' && (o.pay !== 'pre' || o.paid);
const awaitingPay = o => o.status === 'new' && o.pay === 'pre' && !o.paid;

function brief() {
  const now = Date.now(), t0 = dayStart(), m0 = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
  const res = reserved();
  const live = S.orders.filter(o => o.status !== 'cancelled');
  const today = live.filter(o => o.ts >= t0 && o.status !== 'returned');
  const month = live.filter(o => o.ts >= m0 && o.status !== 'returned');
  const owed = S.orders.filter(isOwed);
  const lateOwed = owed.filter(o => now - (o.shipTs || o.ts) > (S.settings.codDays || 7) * DAY);
  const ship = S.orders.filter(readyToShip);
  const lateShip = ship.filter(o => now - (o.paidTs || o.ts) > (S.settings.shipDays || 2) * DAY);
  const active = S.products.filter(p => p.on !== false);
  const low = active.filter(p => { const a = stockOf(p.id) - (res[p.id] || 0); return a <= (Number(p.safe) || 0) && (Number(p.safe) > 0 || (res[p.id] || 0) > 0); })
    .map(p => ({ p, avail: stockOf(p.id) - (res[p.id] || 0), res: res[p.id] || 0 }));
  const short = low.filter(x => x.avail < 0);
  const openInbox = S.inbox.filter(i => i.status !== 'answered');
  const toReply = S.inbox.filter(i => i.status === 'new' || i.status === 'approved');
  const pending = S.approvals.filter(a => decided(a.id) === 'pending');
  const noPrice = active.filter(p => !Number(p.pr));
  const flagged = active.filter(p => (p.flags || []).length);
  const expiring = S.batches.filter(b => b.kind !== 'adj' && b.exp && b.exp - now < 60 * DAY);
  return { today, month, owed, lateOwed, ship, lateShip, low, short, openInbox, toReply, pending, noPrice, flagged, expiring, res,
    todaySum: today.reduce((s, o) => s + orderTotal(o), 0), monthSum: month.reduce((s, o) => s + orderTotal(o), 0), owedSum: owed.reduce((s, o) => s + orderTotal(o), 0) };
}

function customers() {
  const m = new Map();
  for (const o of S.orders) {
    if (o.status === 'cancelled') continue;
    const key = digits(o.phone) || 'n:' + (o.name || '').trim().toLowerCase();
    if (!key || key === 'n:') continue;
    const c = m.get(key) || { key, name: o.name, phone: o.phone, city: o.city, ctype: o.tier, n: 0, sum: 0, owed: 0, last: 0 };
    c.n++; if (o.status !== 'returned') c.sum += orderTotal(o); if (isOwed(o)) c.owed += orderTotal(o);
    if (o.ts > c.last) { c.last = o.ts; c.name = o.name || c.name; c.city = o.city || c.city; c.ctype = o.tier || c.ctype; }
    m.set(key, c);
  }
  return [...m.values()].sort((a, b) => b.last - a.last);
}

V.orders = () => {

let toastT = 0;

}

  const v = val(k);

  else if (o.rows) input = `<textarea data-k="${k}" rows="${o.rows}" placeholder="${esc(o.ph || '')}">${esc(v)}</textarea>`;
  else input = `<input data-k="${k}" type="${o.type || 'text'}" ${o.mode ? `inputmode="${o.mode}"` : ''} value="${esc(v)}" placeholder="${esc(o.ph || '')}">`;
  return `<label class="f"><span>${esc(label)}</span>${input}</label>`;
}

  else if (type === 'inbox-new') sh.vals = { name: '', phone: '', channel: 'wa', text: '' };
  else if (type === 'product') {
    const p = prod(id);
    sh.form = S.isOwner;
    sh.vals = p ? { name: p.name || '', size: p.size || '', cat: p.cat || 'home', pr: p.pr || '', pd: p.pd || '', pb: p.pb || '', safe: p.safe || '', on: p.on === false ? '0' : '1', cost: S.costs[id]?.cost || '' }
      : { name: '', size: '', cat: 'home', pr: '', pd: '', pb: '', safe: '', on: '1', cost: '' };
  }
  else if (type === 'batch-new') sh.vals = { pid: '', qty: '', batchNo: '', mfg: fmtDate(Date.now()), exp: '', note: '' };
  else if (type === 'adjust') sh.vals = { pid: '', actual: '', note: '' };
  else if (type === 'faq-edit') { const f = S.faq.find(x => x.id === id); sh.vals = f ? { q: f.q || '', a: f.a || '', kw: f.kw || '', on: f.on === false ? '0' : '1' } : { q: '', a: '', kw: '', on: '1', ...(preset || {}) }; }
  else if (type === 'post-new') sh.vals = { pid: '', kind: 'fb', lang: 'en', points: '', text: '', text_tr: '' };
  else if (type === 'approval') { const a = S.approvals.find(x => x.id === id); sh.form = S.isOwner && decided(id) === 'pending'; sh.vals = { body: a?.body || '', note: '' }; }
  else if (type === 'settings') sh.vals = { ...S.settings };
  else sh.form = false;
  S.sheet = sh; renderSheet();
}

  }

};

function renderSheet() {

// Recompute the small read-outs inside an open form without redrawing it.
function sheetLive() {
  const sh = S.sheet; if (!sh) return;
  const put = (id, html) => { const e = $('#' + id); if (e) e.innerHTML = html; };
  if (sh.type === 'order-new') {
    const res = reserved(); let tot = 0; const warn = [];
    for (const l of sh.lines) {
      const p = prod(l.pid); if (!p) continue;
      tot += num(l.qty) * num(l.price);
      const av = stockOf(p.id) - (res[p.id] || 0);
      if (num(l.qty) > av) warn.push(`${p.name}：${L('可卖的只有', 'only')} ${av}${L('，可以先接单，但要生产了才能出货。', ' free. You can take the order, but it ships only after production.')}`);
    }
    put('otot', `${L('合计', 'Total')} ${esc(money(tot))}`);
    put('owarn', warn.map(w => `<div class="note">${esc(w)}</div>`).join(''));
  }
  if (sh.type === 'post-new') put('claims', claimPills(checkClaims(val('text'))));
  if (sh.type === 'faq-edit') put('claims', claimPills(checkClaims(val('a'))));
  if (sh.type === 'approval' && sh.form) put('claims', claimPills(checkClaims(val('body'))));
  if (sh.type === 'product' && sh.form) {
    put('pflags', autoFlags(val('name'), val('cat')).map(f => `<div class="note" style="margin-bottom:6px">${esc(lab(FLAGS, f))}</div>`).join(''));
    const c = num(val('cost')), r = num(val('pr'));
    put('margin', c && r ? `${L('零售毛利', 'Retail margin')} ${esc(money(r - c))}（${Math.round((r - c) / r * 100)}%）${num(val('pd')) ? ` · ${L('经销商毛利', 'Distributor margin')} ${esc(money(num(val('pd')) - c))}` : ''}` : '');
  }
  if (sh.type === 'adjust') put('adjnow', val('pid') ? `${L('系统里现在是', 'The system shows')} ${stockOf(val('pid'))}` : '');
}

async function copyText(text) {

  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();

function go(view, filter) {
  if (!VIEWS.includes(view)) view = 'today';
  S.view = view;
  if (filter && S.filter[view] !== undefined) S.filter[view] = filter;
  if (location.hash !== '#' + view) { try { history.replaceState(null, '', '#' + view); } catch { location.hash = '#' + view; } }

const curOrder = () => S.orders.find(o => o.id === S.sheet?.id);

async function shipOrder(id) {
  if (!(await Store.acquire('orders/' + id))) throw { code: 'busy' };
  const o = await Store.get('orders/' + id);
  if (!o || o.status !== 'new') return toast(L('这张订单已经被处理过了。', 'This order has already been handled.'));
  if (o.pay === 'pre' && !o.paid) return toast(L('钱还没收到，不能出货。', 'Payment has not arrived, so it cannot ship.'));
  const need = {};
  for (const it of o.items || []) need[it.pid] = (need[it.pid] || 0) + Number(it.qty);
  for (const pid of Object.keys(need)) {
    const s = await Store.get('stock/' + pid);
    if ((Number(s?.qty) || 0) < need[pid]) return toast(L('库存不够，出不了货。', 'Not enough stock to ship.'));
  }
  const took = [];
  try {
    for (const pid of Object.keys(need)) { await changeStock(pid, -need[pid]); took.push(pid); }
    await Store.update('orders/' + id, { status: 'shipped', shipTs: Date.now() });
  } catch (e) {
    for (const pid of took) { try { await changeStock(pid, need[pid]); } catch { /* reported below */ } }
    throw e;
  }
  toast(L('已出货，库存已扣。', 'Shipped. Stock deducted.'));
}

async function submitApproval(a, inboxId) {
  const id = newId();
  await Store.set('approvals/' + id, { ...a, ts: Date.now(), by: S.uid || '' });
  if (inboxId) await Store.update('inbox/' + inboxId, { status: 'wait', apprId: id });
  return id;
}

      await Store.set('decisions/' + a.id, { status: 'rejected', body: '', note: val('note').trim(), ts: Date.now(), by: S.uid || '' });
      if (a.kind === 'reply' && a.refId) { try { await Store.update('inbox/' + a.refId, { status: 'new', apprId: a.id }); } catch { /* the inquiry may be gone */ } }
      closeSheet(); toast(L('已退回。', 'Sent back.'));
    });
  },
  'faq-from-appr'() { const a = S.approvals.find(x => x.id === S.sheet.id), d = S.decisions[a?.id]; if (a && d) openSheet('faq-edit', null, { q: a.src || '', a: d.body || '' }); },
  'save-settings'() {
    const v = S.sheet.vals;
    run(async () => { await Store.set('settings/main', { company: String(v.company || '').trim(), cur: String(v.cur || 'Rs').trim() || 'Rs', cc: digits(v.cc) || '92', codDays: num(v.codDays) || 7, shipDays: num(v.shipDays) || 2 }); closeSheet(); toast(L('已保存。', 'Saved.')); });
  },
};

document.addEventListener('click', e => {
  if (e.target.id === 'sheet') { if (S.sheet && !S.sheet.form) closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet && !acting) closeSheet(); });
$('#sheet').addEventListener('input', e => {
  const el = e.target, sh = S.sheet; if (!sh) return;
  if (el.dataset.k) sh.vals[el.dataset.k] = el.value;
  if (el.dataset.line != null && sh.lines[+el.dataset.line]) sh.lines[+el.dataset.line][el.dataset.lk] = el.value;
  sheetLive();
});
// Prices and known customers fill themselves in, written straight into the
// fields so the form is never redrawn under the person typing.
$('#sheet').addEventListener('change', e => {
  const el = e.target, sh = S.sheet; if (!sh || sh.type !== 'order-new') return;
  const setLine = (i, price) => { sh.lines[i].price = price ? String(price) : ''; const inp = $(`#sheet [data-line="${i}"][data-lk="price"]`); if (inp) inp.value = sh.lines[i].price; };
  if (el.dataset.lk === 'pid') { const p = prod(el.value); setLine(+el.dataset.line, p ? tierPrice(p, sh.vals.tier) : 0); }
  if (el.dataset.k === 'tier') sh.lines.forEach((l, i) => { const p = prod(l.pid); if (p) setLine(i, tierPrice(p, sh.vals.tier)); });
  if (el.dataset.k === 'phone') {
    const c = customers().find(x => x.key === digits(el.value));
    if (c) for (const [k, v] of [['name', c.name], ['city', c.city]]) if (v && !sh.vals[k].trim()) { sh.vals[k] = v; const inp = $(`#sheet [data-k="${k}"]`); if (inp) inp.value = v; }
  }
  sheetLive();
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) go(v); });

// ---------------------------------------------------------------- start
async function boot() {
  const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h;
  render();
  const use = n => (window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null));
  const [db, user, smp] = await Promise.all([use('db'), use('user'), use('sample')]);
  Store.start(db); S.mode = Store.mode;
  sample = smp; S.hasAI = !!smp;
  if (db && user) {
    const [edit, write, uid] = await Promise.all([user.canEdit(), user.can('data.write'), typeof user.id === 'function' ? user.id() : null].map(p => Promise.resolve(p).catch(() => null)));
    S.isOwner = !!edit; S.canWrite = write; S.uid = uid || null;
  } else S.isOwner = !db;

  const seen = new Set();
  const timer = setTimeout(() => { if (!S.ready) { S.stale = true; refresh(); } }, 10000);
  const need = ['products', 'orders', 'inbox'];
  const mark = c => { seen.add(c); if (!S.ready && need.every(n => seen.has(n))) { S.ready = true; S.stale = false; clearTimeout(timer); } refresh(); };
  const sub = (coll, opts, apply) => Store.watch(coll, opts, rows => { apply(rows); mark(coll); }, () => { if (!seen.has(coll) && need.includes(coll)) { S.stale = true; refresh(); } });
  const byId = rows => Object.fromEntries(rows.map(r => [r.id, r]));
  sub('products', { orderBy: 'ts' }, r => { S.products = r; });
  sub('stock', {}, r => { S.stock = byId(r); });
  sub('orders', { orderBy: 'ts', dir: 'desc', limit: 500 }, r => { S.orders = r; });
  sub('inbox', { orderBy: 'ts', dir: 'desc', limit: 200 }, r => { S.inbox = r; });
  sub('batches', { orderBy: 'ts', dir: 'desc', limit: 200 }, r => { S.batches = r; });
  sub('faq', { orderBy: 'ts', dir: 'desc', limit: 200 }, r => { S.faq = r; });
  sub('approvals', { orderBy: 'ts', dir: 'desc', limit: 200 }, r => { S.approvals = r; });
  sub('decisions', { orderBy: 'ts', dir: 'desc', limit: 300 }, r => { S.decisions = byId(r); });
  sub('settings', {}, r => { const m = r.find(x => x.id === 'main'); if (m) S.settings = { ...S.settings, ...m }; });
  if (S.isOwner) sub('costs', {}, r => { S.costs = byId(r); });
}
boot();
})();
</script>
