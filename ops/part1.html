<meta name="claude:viewport-fit-sides" content="cover">
<title>工厂营运台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one working desk. A sticky header, a tab strip that scrolls on its own,
   then a single column of lists. Everything you type happens in a sheet, so live
   data can redraw the lists underneath without touching what you are typing. */
:root {
  --bg: #f2f6f6; --surface: #ffffff; --sunk: #e9efef;
  --ink: #12262b; --muted: #587076; --line: #d6e0e1;
  --accent: #0a7480; --accent-ink: #ffffff; --accent-soft: #dff0f1;
  --good: #1c7f47; --good-soft: #e0f3e7;
  --warn: #9a5b00; --warn-soft: #fbefd6;
  --bad: #b83227; --bad-soft: #fbe4e1;
  --shadow: 0 1px 2px rgba(18,38,43,.06), 0 6px 18px rgba(18,38,43,.07);
  --f-body: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --f-head: "Space Grotesk", Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1618; --surface: #152124; --sunk: #1b2a2e;
  --ink: #e6efef; --muted: #93a8ac; --line: #2a3b3f;
  --accent: #43b6c2; --accent-ink: #062226; --accent-soft: #173439;
  --good: #5fc88c; --good-soft: #15301f;
  --warn: #e6ae4f; --warn-soft: #33270e;
  --bad: #f08a80; --bad-soft: #3a1b18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1618; --surface: #152124; --sunk: #1b2a2e;
  --ink: #e6efef; --muted: #93a8ac; --line: #2a3b3f;
  --accent: #43b6c2; --accent-ink: #062226; --accent-soft: #173439;
  --good: #5fc88c; --good-soft: #15301f;
  --warn: #e6ae4f; --warn-soft: #33270e;
  --bad: #f08a80; --bad-soft: #3a1b18;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance }
.num { font-variant-numeric: tabular-nums }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line) }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 10px }
.brand { font: 700 17px/1.2 var(--f-head); min-width: 0; flex: 1; overflow-wrap: anywhere }
.brand small { display: block; font: 400 12px/1.3 var(--f-body); color: var(--muted) }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0 }
.nav::-webkit-scrollbar { display: none }
.tab { flex: none; border: 0; background: none; padding: 9px 12px; border-bottom: 2.5px solid transparent; color: var(--muted); cursor: pointer; font-weight: 500; white-space: nowrap }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent) }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bad); color: #fff; font: 600 11px/18px var(--f-body); text-align: center }

main { padding-block: 18px 80px; display: flex; flex-direction: column; gap: 18px }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.head h1 { font-size: 22px }
.head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; max-width: 62ch }
.note { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: 13.5px; border: 1px solid var(--line) }
.note.info { background: var(--accent-soft) }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; color: var(--ink) }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.danger { color: var(--bad) }
.btn.small { padding: 5px 10px; font-size: 13px }
.btn[disabled] { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.stat b { display: block; font: 700 22px/1.2 var(--f-head); font-variant-numeric: tabular-nums }
.stat span { color: var(--muted); font-size: 12.5px }

.list { display: flex; flex-direction: column; gap: 8px }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100% }
button.item { cursor: pointer }
button.item:hover { border-color: var(--accent) }
.item .body { flex: 1; min-width: 0 }
.item .t { font-weight: 600; overflow-wrap: anywhere }
.item .s { color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.item .r { text-align: right; flex: none; font-variant-numeric: tabular-nums }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--muted); white-space: nowrap }
.pill.good { background: var(--good-soft); color: var(--good) }
.pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
.pill.acc { background: var(--accent-soft); color: var(--accent) }
.group h2 { font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px }
.group h2 .count { font: 600 12px/1 var(--f-body); color: var(--muted) }
.todo { border-left: 4px solid var(--line) }
.todo.bad { border-left-color: var(--bad) } .todo.warn { border-left-color: var(--warn) } .todo.good { border-left-color: var(--good) }
.empty { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--muted) }
.empty b { display: block; color: var(--ink); font-family: var(--f-head); margin-bottom: 4px }
.quote { background: var(--sunk); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere }
.zh { color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere }

#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(8,20,23,.45); display: flex; align-items: flex-end; justify-content: center }
.panel { background: var(--surface); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
@media (min-width: 700px) { #sheet { align-items: center } .panel { border-radius: 16px; max-height: 88% } }
.panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.panel-top h2 { font-size: 18px }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.f > span { font-size: 12.5px; color: var(--muted); font-weight: 500 }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 8px 10px; width: 100%; min-width: 0 }
.f textarea { min-height: 96px; resize: vertical }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 70px 90px 34px; gap: 6px; align-items: end }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; max-width: min(92%, 520px); box-shadow: var(--shadow); font-size: 14px }
@media (prefers-reduced-motion: no-preference) { .panel { animation: up .18s ease-out } @keyframes up { from { transform: translateY(14px); opacity: .6 } to { transform: none; opacity: 1 } } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand" id="brand">工厂营运台</div>
      <button class="btn small" id="langBtn" data-act="lang" type="button">EN</button>
      <button class="btn small" id="setBtn" data-act="open-settings" type="button" hidden>设置</button>
    </div>
    <nav class="nav" id="nav" aria-label="sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
