<!doctype html>
<!-- 栖境 · 学习管理: the admin page of the learning backend (lessons, staff, screens, learning records). See admin.js. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f2ea">
<title>栖境 · 学习管理</title>
<link rel="icon" href="./assets/icon-180.png">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* A working page: warm paper, ink, the worlds' gold as the accent; dark when the system is dark. */
:root{
  --bg:#f6f2ea; --panel:#fffdf8; --panel-2:#faf6ee; --ink:#1f1a14; --ink-2:#5d544a; --ink-3:#8c8276; --line:#e6ddcf; --line-2:#d8cdbc;
  --gold:#b88a2e; --gold-2:#d9b263; --gold-bg:#f6ead0; --gold-ink:#2a1f0b;
  --ok:#3d7a43; --ok-bg:#e5f1e2; --warn:#a4641a; --warn-bg:#f8ead6; --bad:#b0412e; --bad-bg:#f7e2dc; --blue:#2f5f86; --blue-bg:#e2edf5;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.06);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121110; --panel:#1b1916; --panel-2:#211e1a; --ink:#f2ece2; --ink-2:#c3b8a8; --ink-3:#8f8577; --line:#2f2b25; --line-2:#3c362e;
    --gold:#e2bd6f; --gold-2:#c9a35c; --gold-bg:#3a2f1a; --gold-ink:#1d1608;
    --ok:#8fcf8c; --ok-bg:#1f3320; --warn:#e8b06a; --warn-bg:#3a2a16; --bad:#f09c86; --bad-bg:#3d1f19; --blue:#8fbfe6; --blue-bg:#1b2c3a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:.06em;margin:0}
.muted{color:var(--ink-3)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--gold-2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:500}
@media (prefers-color-scheme:dark){.btn.primary{color:var(--gold-ink)}}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.btn.small{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn[disabled]{opacity:.5;cursor:default}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:#fff}
a.name{color:var(--ink);text-decoration:none}
a.name:hover{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.link{background:none;border:0;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.input,.select,.textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);font-size:15px;line-height:1.5;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.textarea{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;color:var(--ink-2);font-weight:500}
.field .hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;letter-spacing:.04em;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.tag.blue{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.stars{color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.stars i{color:var(--line-2);font-style:normal}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(420px,100%);padding:30px 28px 26px}
.login .brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px;text-align:center}
.logo{font:700 26px/1 var(--serif);letter-spacing:.32em;margin-right:-.32em}
.login .brand span{font-size:13px;letter-spacing:.3em;color:var(--ink-3);margin-right:-.3em}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:18px}
.seg button{flex:1;height:34px;border:0;border-radius:8px;background:none;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:14px}
.msg{min-height:20px;font-size:13.5px;line-height:1.6}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}

/* the page */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(1.2) blur(8px);backdrop-filter:saturate(1.2) blur(8px)}
.top .in{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.top .bar{display:flex;align-items:center;gap:14px}
.top .logo{font-size:19px}
.top .sub{font-size:13px;letter-spacing:.24em;color:var(--ink-3)}
.top .who{font-size:13.5px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;padding:9px 12px 12px;font-size:14.5px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:500}
.tabs a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;border-radius:2px;background:var(--gold)}
.tabs .n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
main{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:24px}
.head p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:720px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.section{margin-top:22px}
.section>h2,.cols h2{font-size:16px;margin:0 0 12px;letter-spacing:.12em}
.empty{padding:28px 20px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.8}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--gold-bg);color:var(--ink);font-size:14px;line-height:1.7;margin-bottom:16px}
.notice.bad{background:var(--bad-bg)}
.notice b{font-weight:700}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{padding:16px 16px 14px}
.tile b{display:block;font:700 26px/1.2 var(--serif);color:var(--ink)}
.tile span{display:block;margin-top:4px;font-size:13px;color:var(--ink-3)}
.steps-todo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.todo{display:flex;flex-direction:column;gap:8px;padding:16px;text-decoration:none;color:inherit}
.todo .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line-2);font:700 14px/1 var(--serif)}
.todo.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.todo b{font-size:15px}
.todo span{font-size:13px;color:var(--ink-2);line-height:1.6}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12.5px;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;font-size:12.5px;color:var(--ink-3)}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn+.btn{margin-left:6px}
.name{font-weight:500}

/* lessons */
.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px 18px}
.lesson .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 17px/1.4 var(--serif);letter-spacing:.04em}
.lesson .k{color:var(--gold);font:500 14px/1.4 var(--serif);letter-spacing:.24em}
.lesson .a{font-size:13.5px;color:var(--ink-2)}
.lesson .m{font-size:12.5px;color:var(--ink-3)}
.lesson .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lesson .probs{grid-column:1/-1;font-size:13px;color:var(--warn)}
.group-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:13px;letter-spacing:.2em;color:var(--ink-3)}
.group-h:first-child{margin-top:0}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* the lesson editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.editor .meta{display:flex;flex-direction:column;gap:14px}
.step{position:relative;padding:14px 16px 16px;margin-top:12px;border-left:4px solid var(--line-2)}
.step.say{border-left-color:var(--blue)}
.step.ask{border-left-color:var(--gold)}
.step.card-step{border-left-color:var(--ok)}
.step .sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.step .sh b{font-size:13px;letter-spacing:.08em;color:var(--ink-2)}
.step .sh .tools{margin-left:auto;display:flex;gap:2px}
.icon{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--ink-3)}
.icon:hover{background:var(--panel-2);color:var(--ink)}
.icon svg{width:16px;height:16px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:start;padding:10px 12px;margin-top:8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.opt.right{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok-bg) 70%,var(--panel-2))}
.opt .ok{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);padding-top:9px;white-space:nowrap}
.opt .ok input{width:17px;height:17px;accent-color:var(--ok)}
.opt .fs{display:flex;flex-direction:column;gap:6px}
.opt .x{grid-column:2;justify-self:end;margin-top:-4px}
.item{display:grid;grid-template-columns:110px 1fr auto;gap:8px;margin-top:8px}
.add-steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.probs-box{padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;line-height:1.75}
.probs-box.ok{background:var(--ok-bg);color:var(--ok)}
.probs-box ul{margin:4px 0 0;padding-left:18px}
.savebar{position:sticky;bottom:0;z-index:4;margin:18px -20px -80px;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 12px);background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.savebar .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .state{font-size:13.5px;color:var(--ink-3)}

/* the preview: the lesson as the heron says it */
.preview{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto;padding:0;background:#14161b;color:#f5f2ea;border-color:#2b2c30}
.preview .ph{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:#14161b;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;color:rgba(245,242,234,.6);letter-spacing:.12em}
.preview .pv{padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px}
.pv .who{display:inline-flex;align-self:flex-start;padding:3px 12px;border-radius:999px;border:1px solid rgba(230,193,122,.55);color:#e6c17a;font:700 13px/1.5 var(--serif);letter-spacing:.14em}
.pv .say{font:15px/1.8 var(--serif);letter-spacing:.03em}
.pv .say b{color:#e6c17a}
.pv .q{font:500 15px/1.8 var(--serif);letter-spacing:.03em}
.pv .o{display:flex;gap:10px;padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);font-size:13.5px;line-height:1.6}
.pv .o.ok{border-color:rgba(156,208,136,.7);background:rgba(110,170,100,.14)}
.pv .o i{flex:0 0 auto;font-style:normal;color:#e6c17a;font-weight:700}
.pv .r{margin:-4px 0 2px 26px;font-size:12.5px;line-height:1.6;color:rgba(245,242,234,.55)}
.pv .kc{padding:12px;border-radius:12px;border:1px solid rgba(230,193,122,.3);background:rgba(230,193,122,.06)}
.pv .kc h4{margin:0 0 8px;font:500 13px/1.4 var(--serif);letter-spacing:.2em;color:#e6c17a}
.pv .kc div{display:flex;gap:10px;font-size:13px;line-height:1.6;margin-top:4px}
.pv .kc div b{flex:0 0 auto;color:#e6c17a;font-family:var(--serif)}
.pv .end{margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:rgba(245,242,234,.55)}

/* reports */
.bars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:1fr 140px 42px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t.ok{color:var(--ok);font-weight:500}
.bar .g{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--line-2)}
.bar .g i.ok{background:var(--ok)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.q-card{padding:16px 18px;margin-top:12px}
.q-card .q{font:500 15.5px/1.7 var(--serif)}
.q-card .m{margin-top:4px;font-size:13px;color:var(--ink-3)}

/* the code shown once */
.code{font:700 40px/1.2 var(--serif);letter-spacing:.18em;text-align:center;padding:18px 10px;border-radius:14px;background:var(--gold-bg);color:var(--ink);user-select:all;-webkit-user-select:all}
.copyline{display:flex;gap:8px}
.copyline .input{font-size:13px}
ol.how{margin:10px 0 0;padding-left:20px;line-height:1.9;font-size:14px;color:var(--ink-2)}

/* dialogs and toasts */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(20,15,8,.42)}
.dialog{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px 22px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.dialog.wide{width:min(820px,100%)}
.dialog h2{font-size:19px;margin-bottom:6px}
.dialog .lead{margin:0 0 16px;color:var(--ink-2);font-size:14px;line-height:1.7}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--shadow);animation:toast 3.4s ease forwards}
.toast.err{background:var(--bad);color:#fff}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--gold);animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1000px){
  .editor{grid-template-columns:1fr}
  .preview{position:static;max-height:none}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .steps-todo{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
}
@media (max-width:640px){
  main{padding:18px 14px 80px}
  .top .in{padding:10px 14px 0}
  .top .sub{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .steps-todo{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .lesson{grid-template-columns:1fr}
  .lesson .side{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .item{grid-template-columns:80px 1fr auto}
  .bar{grid-template-columns:1fr 80px 36px}
  .savebar{margin:18px -14px -80px;padding-left:14px;padding-right:14px}
  .savebar .state,.savebar .wide-only{display:none}
  .savebar .btn{height:36px;padding:0 13px}
  .code{font-size:32px}
}
@media print{.top,.savebar,.acts,.foot,#toasts{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="card">
    <div class="brand"><div class="logo">栖境</div><span>学习管理</span></div>
    <div class="seg" role="tablist"><button type="button" id="tabLogin" aria-pressed="true">登录</button><button type="button" id="tabClaim" aria-pressed="false">第一次使用</button></div>
    <form class="form" id="formLogin" autocomplete="on">
      <div class="field"><label for="lgName">登录名</label><input class="input" id="lgName" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="lgPass">密码</label><input class="input" id="lgPass" type="password" autocomplete="current-password" required></div>
      <div class="msg" id="lgMsg" aria-live="polite"></div>
      <button class="btn primary" type="submit">登录</button>
    </form>
    <form class="form" id="formClaim" hidden autocomplete="off">
      <div class="field"><label for="clCode">邀请码</label><input class="input mono" id="clCode" placeholder="XXXX-XXXX" autocapitalize="characters" spellcheck="false" required><div class="hint">邀请码只能用一次，7 天内有效。</div></div>
      <div class="field"><label for="clName">你的名字</label><input class="input" id="clName" maxlength="40" placeholder="例如：陈总" required></div>
      <div class="field"><label for="clLogin">登录名</label><input class="input" id="clLogin" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="3–32 个小写字母或数字" required></div>
      <div class="grid2">
        <div class="field"><label for="clPass">密码</label><input class="input" id="clPass" type="password" autocomplete="new-password" placeholder="至少 8 位" required></div>
        <div class="field"><label for="clPass2">再输一次</label><input class="input" id="clPass2" type="password" autocomplete="new-password" required></div>
      </div>
      <div class="msg" id="clMsg" aria-live="polite"></div>
