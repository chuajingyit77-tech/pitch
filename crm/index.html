<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospek Cerah · 指挥中心</title>
<meta name="theme-color" content="#05080F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prospek Cerah">
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<style>
  :root {
    --bg: #05080F;
    --panel: #0C1322;
    --panel-2: #101a2e;
    --line: rgba(90, 140, 220, 0.16);
    --line-bright: rgba(34, 211, 238, 0.5);
    --ink: #E8F1FF;
    --dim: #8DA2C0;
    --faint: #5A6B85;
    --cyan: #22D3EE;
    --cyan-soft: rgba(34, 211, 238, 0.12);
    --amber: #FFB454;
    --amber-soft: rgba(255, 180, 84, 0.12);
    --red: #FF6B6B;
    --red-soft: rgba(255, 107, 107, 0.13);
    --green: #3DDC97;
    --green-soft: rgba(61, 220, 151, 0.12);
    --violet: #A78BFA;
    --violet-soft: rgba(167, 139, 250, 0.14);
    --blue: #5EA7FF;
    --blue-soft: rgba(94, 167, 255, 0.13);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(255, 180, 84, 0.07), transparent 60%),
      radial-gradient(1000px 700px at -10% 0%, rgba(34, 211, 238, 0.08), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(120, 160, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 255, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.25) 60%, transparent);
  }
  .app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 18px 90px; }
  h1, h2, h3 { margin: 0; font-weight: 650; }

  /* ---------- top bar ---------- */
  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 0 10px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-core {
    position: relative; width: 38px; height: 38px; flex: none;
  }
  .brand-core .sun {
    position: absolute; inset: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #FFE9BF, var(--amber) 65%);
    box-shadow: 0 0 18px rgba(255, 180, 84, 0.55);
  }
  .brand-core .orbit {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid var(--line-bright);
    border-top-color: transparent; border-left-color: transparent;
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand h1 { font-size: 17px; letter-spacing: 0.06em; }
  .brand .tag {
    display: block; font: 600 10px var(--mono); letter-spacing: 0.28em;
    color: var(--cyan); text-transform: uppercase; margin-top: 1px;
  }
  .sys {
    margin-left: auto; display: flex; align-items: center; gap: 14px;
    font: 500 12px var(--mono); color: var(--dim);
  }
  .sys .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .sys .clock { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; color: var(--ink); }
  .cloud-chip {
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    font: 600 11px var(--mono); padding: 4px 10px; border-radius: 999px; cursor: pointer;
    letter-spacing: 0.04em;
  }
  .cloud-chip:hover { border-color: var(--line-bright); color: var(--ink); }
  .cloud-chip.ok { color: var(--green); border-color: rgba(61,220,151,0.4); }
  .cloud-chip.busy { color: var(--amber); border-color: rgba(255,180,84,0.4); }
  .cloud-chip.err { color: var(--red); border-color: rgba(255,107,107,0.4); }
  .cloud-form { display: flex; flex-direction: column; gap: 8px; }
  .cloud-form input {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: 14px var(--sans); color-scheme: dark;
  }
  .cloud-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  nav.tabs { display: flex; gap: 4px; width: 100%; border-bottom: 1px solid var(--line); padding-bottom: 0; }
  .navbtn {
    border: none; background: transparent; color: var(--dim); cursor: pointer;
    font: 600 13.5px var(--sans); letter-spacing: 0.04em;
    padding: 10px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .navbtn:hover { color: var(--ink); }
  .navbtn.active { color: var(--cyan); border-bottom-color: var(--cyan); text-shadow: 0 0 12px rgba(34,211,238,.5); }
  .navbtn .n {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px;
    background: var(--red); color: #fff; border-radius: 999px;
    font: 700 11px var(--mono); text-align: center;
  }
  @media (max-width: 620px) { .sys .clock-date { display: none; } }

  /* ---------- shared ---------- */
  .panel {
    background: linear-gradient(180deg, rgba(120,170,255,0.045), rgba(120,170,255,0) 40%), var(--panel);
    border: 1px solid var(--line); border-radius: var(--r);
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px 0;
  }
  .eyebrow {
    font: 700 10px var(--mono); letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--faint);
  }
  .panel-head h3 { font-size: 15px; letter-spacing: 0.02em; }
  .panel-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .count { font: 600 12px var(--mono); color: var(--faint); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); color: var(--ink);
    font: 600 13px var(--sans); padding: 8px 14px; text-decoration: none;
  }
  .btn:hover { border-color: var(--line-bright); box-shadow: 0 0 14px rgba(34,211,238,0.15); }
  .btn.primary {
    background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(34,211,238,0.08));
    border-color: var(--line-bright); color: var(--cyan);
  }
  .btn.warm { background: linear-gradient(135deg, rgba(255,180,84,0.22), rgba(255,180,84,0.06)); border-color: rgba(255,180,84,0.5); color: var(--amber); }
  .btn.danger { color: var(--red); border-color: rgba(255,107,107,0.4); background: transparent; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--dim); }
  .btn.ghost:hover { color: var(--ink); box-shadow: none; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 2px;
  }

  /* ---------- briefing strip ---------- */
  .brief {
    margin-top: 16px; padding: 12px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    border-left: 3px solid var(--cyan);
    background: linear-gradient(90deg, var(--cyan-soft), transparent 70%);
    border-radius: 0 var(--r) var(--r) 0;
  }
  .brief .b-title { font: 700 11px var(--mono); letter-spacing: 0.22em; color: var(--cyan); }
  .brief .b-item { font-size: 13.5px; color: var(--dim); }
  .brief .b-item b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .brief .b-item.alert b { color: var(--red); }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
  @media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { padding: 14px 16px; position: relative; overflow: hidden; min-width: 0; }
  .kpi .label { font: 700 10px var(--mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); }
  .kpi .value { font: 600 26px var(--mono); font-variant-numeric: tabular-nums; margin-top: 4px; letter-spacing: -0.01em; }
  .kpi .hint { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .kpi.cy .value { color: var(--cyan); text-shadow: 0 0 18px rgba(34,211,238,0.35); }
  .kpi.am .value { color: var(--amber); text-shadow: 0 0 18px rgba(255,180,84,0.3); }
  .kpi.rd .value { color: var(--red); text-shadow: 0 0 18px rgba(255,107,107,0.35); }
  .kpi.gn .value { color: var(--green); text-shadow: 0 0 18px rgba(61,220,151,0.3); }
  .kpi::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-bright), transparent);
    opacity: 0.6;
  }

  .cols { display: grid; grid-template-columns: 7fr 5fr; gap: 14px; margin-top: 14px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .cols > * { min-width: 0; }
  .stackcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* ---------- focus list ---------- */
  .focus-list { list-style: none; margin: 0; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .focus {
    position: relative; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px 12px 16px; cursor: pointer; background: var(--panel-2);
    overflow: hidden;
  }
  .focus:hover { border-color: var(--line-bright); }
  .focus::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .focus.p-crit::before { background: var(--red); box-shadow: 0 0 12px var(--red); }
  .focus.p-high::before { background: var(--amber); box-shadow: 0 0 10px rgba(255,180,84,.6); }
  .focus.p-med::before { background: var(--cyan); }
  .focus.p-low::before { background: var(--faint); }
  .focus .f-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .focus .f-rank { font: 700 12px var(--mono); color: var(--faint); }
  .focus .f-name { font-weight: 700; font-size: 15px; }
  .focus .f-co { color: var(--faint); font-size: 12.5px; }
  .focus .f-score {
    margin-left: auto; font: 700 12px var(--mono); font-variant-numeric: tabular-nums;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--dim);
  }
  .focus.p-crit .f-score { color: var(--red); border-color: rgba(255,107,107,.45); }
  .focus.p-high .f-score { color: var(--amber); border-color: rgba(255,180,84,.45); }
  .focus .f-action { margin-top: 6px; font-size: 14px; }
  .focus .f-action .arr { color: var(--cyan); font-family: var(--mono); }
  .focus .f-reasons { margin-top: 7px; display: flex; gap: 6px; flex-wrap: wrap; }
  .rtag {
    font: 600 11px var(--sans); padding: 2px 9px; border-radius: 999px;
    background: rgba(120, 160, 255, 0.08); color: var(--dim); border: 1px solid var(--line);
  }
  .rtag.bad { background: var(--red-soft); color: var(--red); border-color: rgba(255,107,107,.3); }
  .rtag.warm { background: var(--amber-soft); color: var(--amber); border-color: rgba(255,180,84,.3); }
  .rtag.good { background: var(--green-soft); color: var(--green); border-color: rgba(61,220,151,.3); }
  .focus .f-quick { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

  .allclear { padding: 34px 20px; text-align: center; color: var(--dim); }
  .allclear .glyph { font-size: 30px; }
  .allclear p { margin: 8px 0 14px; }

  /* ---------- charts ---------- */
  .chart-wrap { padding: 6px 16px 16px; }
  .funnel-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
  .funnel-row .fl { flex: none; width: 62px; font-size: 12px; color: var(--dim); text-align: right; }
  .funnel-row .bar-track { display: block; flex: 1; height: 18px; background: rgba(120,160,255,0.06); border-radius: 4px; overflow: hidden; }
  .funnel-row .bar {
    display: block; height: 100%; border-radius: 4px; min-width: 2px;
    background: linear-gradient(90deg, rgba(34,211,238,0.85), rgba(94,167,255,0.55));
    box-shadow: 0 0 10px rgba(34,211,238,0.25);
  }
  .funnel-row.won .bar { background: linear-gradient(90deg, rgba(61,220,151,0.9), rgba(61,220,151,0.45)); box-shadow: 0 0 10px rgba(61,220,151,0.3); }
  .funnel-row .fn { flex: none; min-width: 96px; text-align: right; white-space: nowrap; font: 600 11px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
  .spark { display: block; width: 100%; height: 64px; }
  .spark-cap { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--faint); padding: 2px 2px 0; }

  /* ---------- feed ---------- */
  .feed { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; }
  .feed li { display: flex; gap: 10px; padding: 9px 8px; border-radius: 8px; cursor: pointer; align-items: flex-start; }
  .feed li:hover { background: rgba(120,160,255,0.06); }
  .feed .ico { flex: none; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; background: rgba(120,160,255,0.08); border: 1px solid var(--line); }
  .feed .txt { min-width: 0; flex: 1; }
  .feed .line1 { display: block; font-weight: 600; font-size: 13.5px; }
  .feed .line2 { display: block; color: var(--dim); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .when { flex: none; font: 500 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }

  /* ---------- leads ---------- */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0 10px; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 170px; padding: 9px 13px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: 14px var(--sans);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    font: 600 12px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .chip.active { border-color: var(--line-bright); color: var(--cyan); background: var(--cyan-soft); }

  .lead-list { list-style: none; margin: 0; padding: 6px; }
  .lead-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; align-items: center;
    padding: 12px; border-radius: 8px; cursor: pointer;
  }
  .lead-row:hover { background: rgba(120,160,255,0.06); }
  .lead-row + .lead-row { border-top: 1px solid var(--line); border-radius: 0; }
  .lead-row .nm { font-weight: 700; }
  .lead-row .co { color: var(--faint); font-size: 12.5px; }
  .lead-row .nx { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead-row .nx.overdue { color: var(--red); font-weight: 600; }
  .lead-row .val { text-align: right; font: 600 13.5px var(--mono); font-variant-numeric: tabular-nums; }
  .lead-row .meta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  @media (max-width: 640px) {
    .lead-row { grid-template-columns: 1fr auto; }
    .lead-row .meta { grid-column: 1 / -1; justify-content: flex-start; }
  }

  .pill {
    display: inline-block; font: 700 10.5px var(--mono); letter-spacing: 0.08em;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    text-transform: uppercase; color: var(--dim); white-space: nowrap;
  }
  .pill.new { color: var(--ink); border-color: rgba(232,241,255,0.3); }
  .pill.contacted { color: var(--blue); border-color: rgba(94,167,255,0.4); background: var(--blue-soft); }
  .pill.meeting { color: var(--violet); border-color: rgba(167,139,250,0.4); background: var(--violet-soft); }
  .pill.proposal { color: var(--cyan); border-color: rgba(34,211,238,0.4); background: var(--cyan-soft); }
  .pill.negotiation { color: var(--amber); border-color: rgba(255,180,84,0.4); background: var(--amber-soft); }
  .pill.won { color: var(--green); border-color: rgba(61,220,151,0.4); background: var(--green-soft); }
  .pill.lost { color: var(--red); border-color: rgba(255,107,107,0.35); background: var(--red-soft); }

  /* ---------- lead detail ---------- */
  .backlink { display: inline-flex; gap: 6px; margin-top: 14px; background: none; border: none; color: var(--dim); font: 600 13px var(--sans); cursor: pointer; padding: 0; }
  .backlink:hover { color: var(--cyan); }
  .detail-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin: 12px 0 14px; }
  .detail-head h2 { font-size: 23px; }
  .detail-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .detail-grid { display: grid; grid-template-columns: 2fr 3fr; gap: 14px; align-items: start; }
  @media (max-width: 880px) { .detail-grid { grid-template-columns: 1fr; } }
  .detail-grid > * { min-width: 0; }
  .kv { padding: 8px 16px 14px; }
  .kv dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  .kv dt { color: var(--faint); font-size: 12.5px; }
  .kv dd { margin: 0; font-size: 13.5px; word-break: break-word; }
  .kv a { color: var(--cyan); }
  .scorebox { margin: 4px 16px 14px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: rgba(120,160,255,0.05); }
  .scorebox .sb-top { display: flex; align-items: baseline; gap: 8px; }
  .scorebox .sb-num { font: 700 20px var(--mono); color: var(--cyan); }
  .scorebox .sb-lbl { font: 700 10px var(--mono); letter-spacing: 0.2em; color: var(--faint); }
  .scorebox .sb-touch { margin-left: auto; font-size: 12px; color: var(--dim); }
  .next-box {
    margin: 0 16px 16px; padding: 12px 14px; border-radius: 9px;
    border: 1px solid rgba(34,211,238,0.35); background: var(--cyan-soft);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .next-box.overdue { border-color: rgba(255,107,107,0.45); background: var(--red-soft); }
  .next-box .what { font-weight: 700; }
  .next-box .due { display: block; font-size: 12.5px; color: var(--dim); }
  .next-box.overdue .due { color: var(--red); font-weight: 600; }
  .suggest {
    margin: 0 16px 16px; padding: 11px 14px; border-radius: 9px;
    border: 1px dashed rgba(255,180,84,0.45); background: var(--amber-soft);
    font-size: 13.5px;
  }
  .suggest .s-lbl { font: 700 10px var(--mono); letter-spacing: 0.2em; color: var(--amber); display: block; margin-bottom: 3px; }

  .timeline { list-style: none; margin: 0; padding: 8px 16px 14px; }
  .timeline li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .timeline li:first-child { border-top: none; }
  .timeline .t-ico { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: rgba(120,160,255,0.08); border: 1px solid var(--line); font-size: 13px; }
  .timeline .t-body { min-width: 0; flex: 1; }
  .timeline .t-top { display: flex; gap: 8px; align-items: baseline; }
  .timeline .t-type { font-weight: 700; font-size: 13px; }
  .timeline .t-when { margin-left: auto; font: 500 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .timeline .t-notes { font-size: 13.5px; color: var(--dim); white-space: pre-wrap; margin-top: 2px; }
  .timeline .t-del { border: none; background: none; color: var(--faint); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .timeline .t-del:hover { color: var(--red); }

  /* ---------- settings ---------- */
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 700px) { .settings-grid { grid-template-columns: 1fr; } }
  .settings-grid .panel { padding: 18px; }
  .settings-grid h3 { font-size: 15px; margin-bottom: 4px; }
  .settings-grid p { color: var(--dim); font-size: 13.5px; margin: 0 0 14px; }
  .greeting { margin: 18px 0 4px; }
  .greeting h2 { font-size: 22px; }
  .greeting p { margin: 3px 0 0; color: var(--dim); font-size: 13.5px; }

  /* ---------- dialogs ---------- */
  dialog {
    border: 1px solid var(--line-bright); border-radius: 14px; padding: 0;
    background: var(--panel); color: var(--ink);
    width: min(560px, calc(100vw - 32px));
    box-shadow: 0 0 0 1px rgba(34,211,238,0.08), 0 18px 60px rgba(0,0,0,0.6), 0 0 40px rgba(34,211,238,0.08);
  }
  dialog::backdrop { background: rgba(3, 6, 12, 0.7); backdrop-filter: blur(3px); }

  /* briefing dialog */

<script>
(function () {
  "use strict";

  var STORE_KEY = "prospek_cerah_crm_v1";
  var STAGES = ["New", "Contacted", "Meeting", "Proposal", "Negotiation", "Won", "Lost"];
  var ACTIVE_STAGES = ["New", "Contacted", "Meeting", "Proposal", "Negotiation"];
  var STAGE_ZH = { New: "新线索", Contacted: "已联系", Meeting: "会面中", Proposal: "已报价", Negotiation: "谈判中", Won: "成交", Lost: "流失" };
  var ACT_ICONS = { Meeting: "🤝", Call: "📞", WhatsApp: "💬", Email: "✉️", Note: "📝", System: "✅" };
  var ACT_ZH = { Meeting: "会面", Call: "电话", WhatsApp: "WhatsApp", Email: "邮件", Note: "笔记", System: "完成" };

  // ===== Intelligence engine config =====
  // Win probability per stage (weighted forecast, Pipedrive-style)
  var STAGE_PROB = { New: 0.10, Contacted: 0.25, Meeting: 0.40, Proposal: 0.60, Negotiation: 0.80 };
  // Max quiet days per stage before a lead starts "rotting" (deal rotting)
  var ROT_DAYS = { New: 1, Contacted: 4, Meeting: 4, Proposal: 5, Negotiation: 3 };
  // Suggested next action per stage when none is planned
  var SUGGEST = {
    New: "首次联系 — 24 小时内响应，成交率高 21 倍",
    Contacted: "推进约见 — 约一次会面或演示",
    Meeting: "会后 48 小时内跟进 — 发总结或报价",
    Proposal: "跟进报价 — 80% 的成交需要 5 次以上跟进",
    Negotiation: "推动成交 — 处理最后的顾虑，给出期限"
  };

  var db = load();
  var state = { view: "dashboard", leadId: null, search: "", stageFilter: "Active", actType: "Meeting" };

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) { var d = JSON.parse(raw); if (d && d.leads && d.activities) return d; }
    } catch (e) {}
    return { leads: [], activities: [] };
  }
  function save(fromCloud) {
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
    if (!fromCloud) {
      cloudRev = new Date().toISOString();
      localStorage.setItem(STORE_KEY + "_rev", cloudRev);
      schedulePush();
    }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ===== date & format helpers =====
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function shiftStr(base, days) {
    var d = new Date(base + "T00:00:00"); d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function daysFromToday(dateStr) {
    return Math.round((new Date(dateStr + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
  }
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return dateStr;
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }
  function relDue(dateStr) {
    var n = daysFromToday(dateStr);
    if (n < 0) return "逾期 " + Math.abs(n) + " 天";
    if (n === 0) return "今天";
    if (n === 1) return "明天";
    if (n <= 7) return n + " 天后";
    return fmtDate(dateStr);
  }
  function fmtRM(n) {
    n = Number(n) || 0;
    return "RM " + n.toLocaleString("en-MY", { maximumFractionDigits: 0 });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function waLink(l) {
    if (!l.phone) return null;
    var num = l.phone.replace(/\D/g, "").replace(/^0/, "60");
    var msg = "Hi " + (l.name.split(" ")[0] || "") + "! ";
    return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
  }

  // ===== data helpers =====
  function lead(id) { return db.leads.find(function (l) { return l.id === id; }); }
  function leadActivities(id) {
    return db.activities.filter(function (a) { return a.leadId === id; })
      .sort(function (a, b) { return b.when.localeCompare(a.when) || b.createdAt - a.createdAt; });
  }
  function touchCount(id) {
    return db.activities.filter(function (a) { return a.leadId === id && a.type !== "System" && a.type !== "Note"; }).length;
  }
  function lastTouch(l) {
    var acts = leadActivities(l.id);
    return acts.length ? acts[0].when : (l.createdAt || "").slice(0, 10);
  }
  function isActive(l) { return ACTIVE_STAGES.indexOf(l.stage) >= 0; }

  // ===== priority engine =====
  // Score 0-100: urgency (overdue / rotting) + deal value + stage progress
  function analyse(l) {
    var idle = Math.max(0, -daysFromToday(lastTouch(l) || todayStr()));
    var rotLimit = ROT_DAYS[l.stage] || 5;
    var rotting = idle > rotLimit;
    var reasons = [];
    var urgency = 0;

    if (l.next && l.next.what && l.next.due) {
      var n = daysFromToday(l.next.due);
      if (n < 0) { urgency = Math.min(70, 45 + Math.abs(n) * 5); reasons.push({ t: "跟进逾期 " + Math.abs(n) + " 天", c: "bad" }); }
      else if (n === 0) { urgency = 40; reasons.push({ t: "今天到期", c: "warm" }); }
      else if (n <= 2) { urgency = 15; reasons.push({ t: n + " 天后到期", c: "" }); }
    } else {
      urgency = 25;
      reasons.push({ t: "没有安排下一步", c: "warm" });
    }
    if (l.stage === "New" && idle >= 1) {
      urgency = Math.max(urgency, 55);
      reasons.push({ t: "新线索已 " + idle + " 天未联系", c: "bad" });
    } else if (rotting) {
      urgency = Math.max(urgency, Math.min(60, 30 + (idle - rotLimit) * 4));
      reasons.push({ t: "静默 " + idle + " 天（" + STAGE_ZH[l.stage] + "阶段上限 " + rotLimit + " 天）", c: "bad" });
    }

    var maxVal = db.leads.filter(isActive).reduce(function (m, x) { return Math.max(m, Number(x.value) || 0); }, 0);
    var valuePts = maxVal ? Math.round((Number(l.value) || 0) / maxVal * 18) : 0;
    if (valuePts >= 14 && Number(l.value) > 0) reasons.push({ t: "高价值 " + fmtRM(l.value), c: "good" });
    var stagePts = Math.round((STAGE_PROB[l.stage] || 0) * 15);
    var tc = touchCount(l.id);
    if (tc > 0 && tc < 5 && (l.stage === "Proposal" || l.stage === "Negotiation")) {
      reasons.push({ t: "已跟进 " + tc + " 次 · 80% 成交需 5 次以上", c: "" });
    }

    var score = Math.min(99, urgency + valuePts + stagePts);
    var action = (l.next && l.next.what) ? l.next.what : (SUGGEST[l.stage] || "跟进");
    var suggested = !(l.next && l.next.what);
    return { lead: l, score: score, urgency: urgency, reasons: reasons, action: action, suggested: suggested, idle: idle, rotting: rotting };
  }
  function focusList() {
    return db.leads.filter(isActive).map(analyse)
      .sort(function (a, b) { return b.score - a.score; });
  }
  function urgentCount() {
    return focusList().filter(function (f) { return f.urgency >= 40; }).length;
  }
  function prioClass(f) {
    if (f.urgency >= 45) return "p-crit";
    if (f.urgency >= 35) return "p-high";
    if (f.score >= 30) return "p-med";
    return "p-low";
  }

  // ===== render =====
  var $view = document.getElementById("view");

  function render() {
    document.querySelectorAll(".navbtn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.nav === state.view || (state.view === "lead" && b.dataset.nav === "leads"));
    });
    var badge = document.getElementById("nav-badge");
    var uc = urgentCount();
    badge.hidden = uc === 0;
    badge.textContent = uc;
    document.title = (uc ? "(" + uc + ") " : "") + "Prospek Cerah · 指挥中心";

    if (state.view === "dashboard") renderDashboard();
    else if (state.view === "leads") renderLeads();
    else if (state.view === "lead") renderLeadDetail();
    else if (state.view === "settings") renderSettings();
    window.scrollTo(0, 0);
  }

  function renderDashboard() {
    var active = db.leads.filter(isActive);
    var focus = focusList();
    var pipelineValue = active.reduce(function (s, l) { return s + (Number(l.value) || 0); }, 0);
    var forecast = active.reduce(function (s, l) { return s + (Number(l.value) || 0) * (STAGE_PROB[l.stage] || 0); }, 0);
    var monthPrefix = todayStr().slice(0, 7);
    var wonThisMonth = db.leads.filter(function (l) {
      return l.stage === "Won" && (l.wonAt || "").slice(0, 7) === monthPrefix;
    }).reduce(function (s, l) { return s + (Number(l.value) || 0); }, 0);
    var overdue = focus.filter(function (f) { return f.lead.next && f.lead.next.due && daysFromToday(f.lead.next.due) < 0; }).length;
    var dueToday = focus.filter(function (f) { return f.lead.next && f.lead.next.due && daysFromToday(f.lead.next.due) === 0; }).length;
    var coldNew = focus.filter(function (f) { return f.lead.stage === "New" && f.idle >= 1; }).length;
    var weekTouches = db.activities.filter(function (a) {
      return a.type !== "System" && daysFromToday(a.when) > -7;
    }).length;

    var html = "";

    // briefing strip
    html += '<div class="brief"><span class="b-title">今日简报 // BRIEFING</span>' +
      '<span class="b-item' + (overdue ? " alert" : "") + '"><b>' + overdue + '</b> 项逾期</span>' +
      '<span class="b-item"><b>' + dueToday + '</b> 项今天到期</span>' +
      (coldNew ? '<span class="b-item alert"><b>' + coldNew + '</b> 个新线索未联系</span>' : "") +
      '<span class="b-item">本周已跟进 <b>' + weekTouches + '</b> 次</span>' +
      '<button class="btn small ghost" data-action="brief" style="margin-left:auto">查看简报 →</button></div>';

    // KPIs
    html += '<div class="kpis">' +
      kpi("cy", "PIPELINE · 管道总值", fmtRM(pipelineValue), active.length + " 个活跃线索") +
      kpi("am", "FORECAST · 加权预测", fmtRM(Math.round(forecast)), "按阶段成交率折算") +
      kpi("gn", "WON · 本月成交", fmtRM(wonThisMonth), "") +
      kpi(overdue + coldNew > 0 ? "rd" : "gn", "ALERT · 需要行动", String(overdue + dueToday + coldNew), overdue + coldNew > 0 ? "逾期 / 今天 / 冷却新线索" : "全部在掌控中") +
      "</div>";

    html += '<div class="cols">';

    // FOCUS
    html += '<div class="panel"><div class="panel-head"><span class="eyebrow">FOCUS</span><h3>今天最该做的事</h3>' +
      '<span class="count">' + focus.length + '</span>' +
      '<span class="right"><button class="btn small primary" data-action="add-lead">+ 新增线索</button></span></div>';
    if (!db.leads.length) {
      html += '<div class="allclear"><div class="glyph">🛰️</div><p>系统就绪。加入第一个线索，引擎就会开始为你排优先级。</p>' +
        '<button class="btn primary" data-action="add-lead">+ 新增第一个线索</button>' +
        '<p style="margin-top:12px"><button class="btn small ghost" data-action="sample">…或载入示范数据看看效果</button></p></div>';
    } else if (!focus.length) {
      html += '<div class="allclear"><div class="glyph">✨</div><p>没有活跃线索。去成交下一单吧。</p></div>';
    } else {
      html += '<ul class="focus-list">' + focus.slice(0, 8).map(function (f, i) {
        var l = f.lead;
        var wa = waLink(l);
        return '<li class="focus ' + prioClass(f) + '" data-open-lead="' + l.id + '">' +
          '<div class="f-top"><span class="f-rank">#' + (i + 1) + '</span>' +
          '<span class="f-name">' + esc(l.name) + '</span>' +
          (l.company ? '<span class="f-co">' + esc(l.company) + '</span>' : "") +
          '<span class="pill ' + l.stage.toLowerCase() + '">' + STAGE_ZH[l.stage] + '</span>' +
          '<span class="f-score">P·' + f.score + '</span></div>' +
          '<div class="f-action"><span class="arr">»</span> ' + esc(f.action) + (f.suggested ? ' <span style="color:var(--amber);font-size:11.5px">（系统建议）</span>' : "") + '</div>' +
          '<div class="f-reasons">' + f.reasons.map(function (r) { return '<span class="rtag ' + r.c + '">' + esc(r.t) + "</span>"; }).join("") + '</div>' +
          '<div class="f-quick">' +
          (wa ? '<a class="btn small" href="' + wa + '" target="_blank" rel="noopener" data-stop>💬 WhatsApp</a>' : "") +
          (l.phone ? '<a class="btn small" href="tel:' + esc(l.phone.replace(/\s/g, "")) + '" data-stop>📞 拨打</a>' : "") +
          '<button class="btn small warm" data-log-lead="' + l.id + '" data-stop>✍️ 记录跟进</button>' +
          '</div></li>';
      }).join("") + "</ul>";
    }
    html += "</div>";

    // right column
    html += '<div class="stackcol">';

    // funnel
    if (db.leads.length) {
      var maxCount = Math.max.apply(null, STAGES.map(function (s) { return db.leads.filter(function (l) { return l.stage === s; }).length; }).concat([1]));
      html += '<div class="panel"><div class="panel-head"><span class="eyebrow">FUNNEL</span><h3>销售漏斗</h3></div><div class="chart-wrap">' +
        STAGES.filter(function (s) { return s !== "Lost"; }).map(function (s) {
          var ls = db.leads.filter(function (l) { return l.stage === s; });
          var v = ls.reduce(function (sum, l) { return sum + (Number(l.value) || 0); }, 0);
          return '<div class="funnel-row' + (s === "Won" ? " won" : "") + '" data-stage-jump="' + s + '" style="cursor:pointer">' +
            '<span class="fl">' + STAGE_ZH[s] + '</span>' +
            '<span class="bar-track"><span class="bar" style="width:' + Math.round(ls.length / maxCount * 100) + '%"></span></span>' +
            '<span class="fn">' + ls.length + ' · ' + (v ? fmtRM(v) : "—") + '</span></div>';
        }).join("") + "</div></div>";
    }

    // activity sparkline (14 days)

      sparkline() + '<div class="spark-cap"><span>' + fmtDate(shiftStr(todayStr(), -13)) + '</span><span>今天</span></div></div></div>';

    var recent = db.activities.slice()
      .sort(function (a, b) { return b.when.localeCompare(a.when) || b.createdAt - a.createdAt; })
      .slice(0, 6);
    html += '<div class="panel"><div class="panel-head"><span class="eyebrow">LOG</span><h3>最近动态</h3></div>';
    if (!recent.length) {
      html += '<div class="allclear" style="padding:20px"><p style="margin:0">还没有记录。见完客户后，打开线索按「记录跟进」。</p></div>';
    } else {
      html += '<ul class="feed">' + recent.map(function (a) {
        var l = lead(a.leadId);
        return '<li data-open-lead="' + a.leadId + '">' +
          '<span class="ico">' + (ACT_ICONS[a.type] || "📝") + '</span>' +
          '<span class="txt"><span class="line1">' + (ACT_ZH[a.type] || a.type) + ' · ' + esc(l ? l.name : "已删除") + '</span>' +
          '<span class="line2">' + esc(a.notes) + '</span></span>' +
          '<span class="when">' + fmtDate(a.when) + '</span></li>';
      }).join("") + "</ul>";
    }

  function kpi(cls, label, value, hint) {
    return '<div class="panel kpi ' + cls + '"><div class="label">' + label + '</div>' +
      '<div class="value" data-animate>' + value + '</div>' +
      (hint ? '<div class="hint">' + hint + "</div>" : "") + "</div>";
  }

  function sparkline() {
    var days = [];
    for (var i = 13; i >= 0; i--) {
      var d = shiftStr(todayStr(), -i);
      days.push(db.activities.filter(function (a) { return a.when === d && a.type !== "System"; }).length);
    }
    var max = Math.max.apply(null, days.concat([1]));
    var W = 300, H = 60, step = W / 13;
    var pts = days.map(function (v, i) { return [i * step, H - 6 - (v / max) * (H - 14)]; });
    var line = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    var area = line + " L" + W + " " + H + " L0 " + H + " Z";
    var last = pts[pts.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-label="近14天跟进次数">' +
      '<path d="' + area + '" fill="rgba(34,211,238,0.12)"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--cyan)" stroke-width="1.6"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="var(--cyan)"/></svg>';
  }

  function animateNumbers() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.querySelectorAll("[data-animate]").forEach(function (el) {
      var text = el.textContent;
      var m = text.match(/([\d,]+)/);
      if (!m) return;
      var target = Number(m[1].replace(/,/g, ""));
      if (!target || target > 10000000) return;
      var start = performance.now(), dur = 600;
      function tick(now) {
        var p = Math.min(1, (now - start) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        var cur = Math.round(target * eased);
        el.textContent = text.replace(m[1], cur.toLocaleString("en-MY"));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  // ===== briefing =====
  function showBriefing() {
    var focus = focusList();
    var overdue = focus.filter(function (f) { return f.lead.next && f.lead.next.due && daysFromToday(f.lead.next.due) < 0; });
    var dueToday = focus.filter(function (f) { return f.lead.next && f.lead.next.due && daysFromToday(f.lead.next.due) === 0; });
    var coldNew = focus.filter(function (f) { return f.lead.stage === "New" && f.idle >= 1; });
    var rotting = focus.filter(function (f) { return f.rotting && f.lead.stage !== "New"; });
    var forecast = db.leads.filter(isActive).reduce(function (s, l) { return s + (Number(l.value) || 0) * (STAGE_PROB[l.stage] || 0); }, 0);

    var b = "";
    b += '<div class="b-row"><span class="b-num rd">' + overdue.length + '</span><span>项跟进<b style="color:var(--red)">逾期</b>' +
      (overdue.length ? " — " + overdue.slice(0, 3).map(function (f) { return esc(f.lead.name); }).join("、") : "") + "</span></div>";
    b += '<div class="b-row"><span class="b-num am">' + dueToday.length + '</span><span>项<b style="color:var(--amber)">今天到期</b>' +
      (dueToday.length ? " — " + dueToday.slice(0, 3).map(function (f) { return esc(f.lead.name); }).join("、") : "") + "</span></div>";
    if (coldNew.length) b += '<div class="b-row"><span class="b-num rd">' + coldNew.length + '</span><span>个新线索还没首次联系 — 速度就是成交率</span></div>';
    if (rotting.length) b += '<div class="b-row"><span class="b-num am">' + rotting.length + '</span><span>个线索静默太久，快发臭了 — ' + rotting.slice(0, 3).map(function (f) { return esc(f.lead.name); }).join("、") + "</span></div>";
    b += '<div class="b-row"><span class="b-num cy">' + (focus.length ? "P·" + focus[0].score : "—") + '</span><span>今日头号目标：' +
      (focus.length ? "<b>" + esc(focus[0].lead.name) + "</b> — " + esc(focus[0].action) : "暂无") + "</span></div>";
    b += '<div class="b-row"><span class="b-num gn">' + fmtRM(Math.round(forecast)).replace("RM ", "") + '</span><span>加权预测成交额（RM）</span></div>';
    b += '<div style="padding-top:14px;text-align:right"><button class="btn primary" data-close>开工 →</button></div>';
    document.getElementById("brief-body").innerHTML = b;

  function maybeAutoBrief() {

      localStorage.setItem(key, todayStr());

  // ===== notifications =====
  function notify(title, body, tag) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try { new Notification(title, { body: body, tag: tag }); } catch (e) {}
  }
  function runNotifier() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var logKey = STORE_KEY + "_notified";
    var log = {};
    try { log = JSON.parse(localStorage.getItem(logKey) || "{}"); } catch (e) {}
    var today = todayStr();
    var focus = focusList();
    focus.forEach(function (f) {
      var l = f.lead;
      var key = null, title = null, body = null;
      if (l.next && l.next.due && daysFromToday(l.next.due) < 0) {
        key = "od_" + l.id + "_" + l.next.due;
        title = "⚠️ 跟进逾期：" + l.name;
        body = l.next.what + "（" + relDue(l.next.due) + "）";
      } else if (l.next && l.next.due && daysFromToday(l.next.due) === 0) {
        key = "dt_" + l.id + "_" + l.next.due;
        title = "⏰ 今天到期：" + l.name;
        body = l.next.what;
      } else if (l.stage === "New" && f.idle >= 1) {
        key = "nw_" + l.id;
        title = "🚨 新线索冷却中：" + l.name;
        body = "已 " + f.idle + " 天未联系 — 越快联系成交率越高";
      }
      if (key && log[key] !== today) {
        notify(title, body, key);
        log[key] = today;
      }
    });
    localStorage.setItem(logKey, JSON.stringify(log));
  }

  // ===== CSV import =====
  function parseCSV(text) {
    var rows = [], row = [], cell = "", inQ = false;
    text = text.replace(/^﻿/, "");
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
        else cell += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = "";
        if (row.some(function (c) { return c.trim() !== ""; })) rows.push(row);
        row = [];
      } else cell += ch;
    }
    row.push(cell);
    if (row.some(function (c) { return c.trim() !== ""; })) rows.push(row);
    return rows;
  }
  function importCSV(file) {
    var r = new FileReader();
    r.onload = function () {
      var rows = parseCSV(String(r.result));
      if (rows.length < 2) { alert("CSV 里没有数据行。第一行要是列名，如：name,phone,company"); return; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      function col(keys) {
        for (var i = 0; i < head.length; i++) {
          for (var k = 0; k < keys.length; k++) if (head[i].indexOf(keys[k]) >= 0) return i;
        }
        return -1;
      }
      var ci = {
        name: col(["name", "姓名", "客户"]), company: col(["company", "公司"]),
        phone: col(["phone", "电话", "手机", "tel", "whatsapp"]), email: col(["email", "邮箱", "mail"]),
        value: col(["value", "价值", "金额", "amount"]), source: col(["source", "来源"])
      };
      if (ci.name < 0) { alert("找不到姓名列 — 第一行需要有 name 或 姓名。"); return; }
      var added = 0;
      var newLeads = [];
      rows.slice(1).forEach(function (row) {
        var nm = (row[ci.name] || "").trim();
        if (!nm) return;
        newLeads.push({
          id: uid(), name: nm,
          company: ci.company >= 0 ? (row[ci.company] || "").trim() : "",
          phone: ci.phone >= 0 ? (row[ci.phone] || "").trim() : "",
          email: ci.email >= 0 ? (row[ci.email] || "").trim() : "",
          value: ci.value >= 0 ? (Number(String(row[ci.value]).replace(/[^\d.]/g, "")) || 0) : 0,
          source: ci.source >= 0 ? (row[ci.source] || "Other").trim() : "Other",
          stage: "New", notes: "", next: null, createdAt: new Date().toISOString()
        });
        added++;
      });
      if (!added) { alert("没有可导入的行。"); return; }
      if (!confirm("导入 " + added + " 个客户为「新线索」？")) return;
      db.leads = db.leads.concat(newLeads);
      save(); render();
      toast("已导入 " + added + " 个客户 ⚡");
    };
    r.readAsText(file);
  }

      var msgEl = document.getElementById("cl-msg");
      if (!em || !pw) { if (msgEl) { msgEl.textContent = "邮箱和密码都要填。"; msgEl.style.color = "var(--red)"; } return; }
      cloudLogin(em.trim(), pw, msgEl);
    }
    else if (act === "cloud-sync-now") syncNow();
    else if (act === "cloud-logout") {
      cloud.session = null; saveSession(); updateChip(); render();
      toast("已退出云同步（本机数据保留）");
    }
    else if (act === "enable-notif") {
      Notification.requestPermission().then(function (p) {
        render();
        if (p === "granted") { notify("🔔 Prospek Cerah 提醒已开启", "有需要跟进的事，系统会主动叫你。", "welcome"); runNotifier(); }
      });
    }
    else if (act === "test-notif") notify("🛰️ 测试通知", "收到了？系统运作正常。", "test");
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "import-file" && e.target.files[0]) {
      doImport(e.target.files[0]);
      e.target.value = "";
    }
    if (e.target && e.target.id === "csv-file" && e.target.files[0]) {
      importCSV(e.target.files[0]);
      e.target.value = "";
    }
  });

  // offline support (works when served over https, e.g. the installed app)
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }

  tickClock();
  render();
  updateChip();
  maybeAutoBrief();
  runNotifier();
  if (cloudConfigured() && cloud.session) syncNow();
})();
</script>
<!-- ARTIFACT-BODY-END -->
</body>
</html>
